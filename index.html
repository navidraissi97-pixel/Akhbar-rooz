<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اخبار روز</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #c00;
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav {
      background: white;
      padding: 12px;
      text-align: center;
    }

    nav button {
      padding: 8px 15px;
      margin: 3px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    nav button.active {
      background: #c00;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 15px;
    }

    .breaking {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .search {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
    }

    .search input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .search button {
      padding: 10px 20px;
      border: none;
      background: #c00;
      color: white;
      border-radius: 5px;
    }

    .title {
      background: white;
      padding: 15px;
      border-radius: 8px;
    }

    #newsList {
      background: white;
      padding: 15px;
      border-radius: 8px;
    }

    .news-item {
      padding: 15px 0;
      border-bottom: 1px solid #ddd;
    }

    .news-item h2 {
      font-size: 20px;
    }

    .news-item p {
      line-height: 1.8;
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>اخبار روز</h1>
    <p>آخرین اخبار ایران و جهان</p>
  </header>

  <nav>
    <button class="active">همه</button>
    <button>ایران</button>
    <button>جهان</button>
    <button>ورزش</button>
    <button>فناوری</button>
  </nav>

  <div class="container">

    <div class="breaking">
      🔴 خبر فوری | تازه‌ترین رویدادهای مهم را اینجا دنبال کنید
    </div>

    <div class="search">
      <input type="text" placeholder="جستجوی خبر...">
      <button>جستجو</button>
    </div>

    <h2 class="title">آخرین اخبار</h2>

    <div id="newsList">
      <p>⏳ در حال بارگذاری اخبار...</p>
    </div>

  </div>

  <footer>
    © ۱۴۰۵ — ساخته شده با ❤️
  </footer>


<script src="./news.js"></script>
</body>
</html>
