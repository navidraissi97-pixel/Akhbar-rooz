<!DOCTYPE html><html lang="fa" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description"
content="اخبار روز؛ آخرین اخبار ایران و جهان، ورزش و فناوری">

<title>اخبار روز | آخرین اخبار ایران و جهان</title><style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#f1f3f6;
    color:#222;
}

header{
    background:linear-gradient(135deg,#0d47a1,#1976d2);
    color:white;
    text-align:center;
    padding:28px 15px;
}

header h1{
    font-size:30px;
    margin-bottom:10px;
}

header p{
    font-size:15px;
    opacity:.9;
}

nav{
    background:white;
    display:flex;
    justify-content:center;
    gap:8px;
    padding:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    position:sticky;
    top:0;
    z-index:10;
}

nav button{
    border:0;
    background:#eeeeee;
    padding:10px 17px;
    border-radius:20px;
    cursor:pointer;
    font-family:inherit;
    font-size:14px;
    transition:.2s;
}

nav button:hover,
nav button.active{
    background:#1976d2;
    color:white;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px 15px;
}

.title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:18px;
    border-right:5px solid #1976d2;
    padding-right:10px;
}

.news-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;
}

.news-card{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    transition:.25s;
}

.news-card:hover{
    transform:translateY(-4px);
    box-shadow:0 8px 22px rgba(0,0,0,.15);
}

.news-image{
    width:100%;
    height:210px;
    object-fit:cover;
    display:block;
    background:#ddd;
}

.news-content{
    padding:18px;
}

.news-card h2{
    font-size:18px;
    line-height:1.8;
    margin-bottom:10px;
}

.news-card p{
    color:#555;
    line-height:1.9;
    font-size:14px;
    margin-bottom:12px;
}

.date{
    color:#888;
    font-size:12px;
    margin-bottom:14px;
}

.read-more{
    display:inline-block;
    background:#1976d2;
    color:white;
    text-decoration:none;
    padding:9px 16px;
    border-radius:7px;
    font-size:13px;
}

.read-more:hover{
    background:#0d47a1;
}

.message{
    background:white;
    padding:25px;
    border-radius:10px;
    text-align:center;
    color:#666;
    grid-column:1/-1;
}

.loading{
    text-align:center;
    padding:30px;
    font-size:16px;
    grid-column:1/-1;
}

footer{
    margin-top:30px;
    background:#222;
    color:#ddd;
    text-align:center;
    padding:20px;
    font-size:13px;
}

@media(max-width:600px){

    header h1{
        font-size:24px;
    }

    nav{
        overflow-x:auto;
        justify-content:flex-start;
    }

    nav button{
        white-space:nowrap;
    }

    .container{
        padding:15px 10px;
    }

    .news-list{
        grid-template-columns:1fr;
        gap:15px;
    }

    .news-image{
        height:200px;
    }

    .news-card h2{
        font-size:17px;
    }

}

</style></head><body><header><h1>📰 اخبار روز</h1><p>آخرین اخبار ایران و جهان | ورزش | فناوری</p></header><nav><button class="active" onclick="loadNews('all',this)">
همه اخبار
</button><button onclick="loadNews('iran',this)">
🇮🇷 ایران
</button><button onclick="loadNews('world',this)">
🌍 جهان
</button><button onclick="loadNews('sport',this)">
⚽ ورزش
</button><button onclick="loadNews('tech',this)">
💻 فناوری
</button></nav><main class="container"><div class="title">
آخرین اخبار
</div><section id="newsList" class="news-list"><div class="loading">
⏳ در حال دریافت آخرین اخبار...
</div></section></main><footer>© 2026 اخبار روز — تمامی حقوق محفوظ است.

</footer><script>

const feeds = {

    iran:
    "https://www.mehrnews.com/rss",

    world:
    "https://www.theguardian.com/world/rss",

    sport:
    "https://www.theguardian.com/sport/rss",

    tech:
    "https://www.theguardian.com/technology/rss"

};


async function getRSS(rssUrl){

    const api =
    "https://api.rss2json.com/v1/api.json?rss_url="
    + encodeURIComponent(rssUrl);

    const response =
    await fetch(api);

    if(!response.ok){
        throw new Error("خطا در دریافت اخبار");
    }

    const data =
    await response.json();

    if(data.status !== "ok"){
        throw new Error("RSS قابل دریافت نیست");
    }

    return data.items || [];

}


async function loadNews(category="all",button=null){

    const newsList =
    document.getElementById("newsList");


    if(button){

        document
        .querySelectorAll("nav button")
        .forEach(btn =>
            btn.classList.remove("active")
        );

        button.classList.add("active");

    }


    newsList.innerHTML =
    '<div class="loading">⏳ در حال دریافت آخرین اخبار...</div>';


    try{

        let allItems = [];


        if(category === "all"){

            const results =
            await Promise.allSettled([

                getRSS(feeds.iran),
                getRSS(feeds.world),
                getRSS(feeds.sport),
                getRSS(feeds.tech)

            ]);


            results.forEach(result => {

                if(result.status === "fulfilled"){

                    allItems =
                    allItems.concat(result.value);

                }

            });

        }
        else{

            allItems =
            await getRSS(feeds[category]);

        }


        if(allItems.length === 0){

            newsList.innerHTML =
            '<div class="message">❌ خبری پیدا نشد.</div>';

            return;

        }


        /* حذف خبرهای تکراری */

        const unique = [];

        const titles =
        new Set();


        allItems.forEach(item => {

            if(
                item.title &&
                !titles.has(item.title)
            ){

                titles.add(item.title);

                unique.push(item);

            }

        });


        /* مرتب‌سازی جدیدترین خبرها */

        unique.sort((a,b) => {

            return new Date(b.pubDate) -
                   new Date(a.pubDate);

        });


        newsList.innerHTML = "";


        unique.slice(0,30).forEach(item => {

            const article =
            document.createElement("article");

            article.className =
            "news-card";


            /* پیدا کردن عکس خبر */

            let imageUrl = "";


            if(item.thumbnail){

                imageUrl =
                item.thumbnail;

            }
            else if(
                item.enclosure &&
                item.enclosure.link
            ){

                imageUrl =
                item.enclosure.link;

            }
            else if(
                item.enclosure &&
                item.enclosure.url
            ){

                imageUrl =
                item.enclosure.url;

            }


            /* عکس */

            if(imageUrl){

                const image =
                document.createElement("img");

                image.className =
                "news-image";

                image.src =
                imageUrl;

                image.alt =
                item.title || "تصویر خبر";

                image.loading =
                "lazy";


                image.onerror =
                function(){

                    this.style.display =
                    "none";

                };


                article.appendChild(image);

            }


            /* محتوای کارت */

            const content =
            document.createElement("div");

            content.className =
            "news-content";


            /* تیتر */

            const title =
            document.createElement("h2");

            title.textContent =
            item.title ||
            "بدون عنوان";


            /* توضیح */

            const description =
            document.createElement("p");

            description.textContent =
            cleanText(item.description) ||
            "برای مشاهده جزئیات خبر روی ادامه خبر کلیک کنید.";


            /* تاریخ */

            const date =
            document.createElement("div");

            date.className =
            "date";

            date.textContent =
            formatDate(item.pubDate);


            /* لینک */

            const link =
            document.createElement("a");

            link.className =
            "read-more";

            link.href =
            item.link || "#";

            link.target =
            "_blank";

            link.rel =
            "noopener noreferrer";

            link.textContent =
            "ادامه خبر";


            content.appendChild(title);

            content.appendChild(description);

            content.appendChild(date);

            content.appendChild(link);


            article.appendChild(content);

            newsList.appendChild(article);

        });


    }
    catch(error){

        console.error(error);


        newsList.innerHTML = `

        <div class="message">

        ❌ دریافت اخبار انجام نشد.

        <br><br>

        لطفاً چند لحظه بعد دوباره امتحان کنید.

        </div>

        `;

    }

}


/* تمیز کردن متن خبر */

function cleanText(text){

    if(!text)
        return "";


    const div =
    document.createElement("div");


    div.innerHTML =
    text;


    return div.textContent
        .replace(/\s+/g," ")
        .trim()
        .substring(0,220);

}


/* نمایش تاریخ فارسی */

function formatDate(date){

    if(!date)
        return "";


    const d =
    new Date(date);


    if(isNaN(d))
        return date;


    return d.toLocaleDateString(
        "fa-IR",
        {
            year:"numeric",
            month:"2-digit",
            day:"2-digit"
        }
    );

}


/* دریافت اخبار هنگام باز شدن سایت */

loadNews();


/* بروزرسانی خودکار هر 10 دقیقه */

setInterval(function(){

    loadNews();

},600000);

</script></body></html>
